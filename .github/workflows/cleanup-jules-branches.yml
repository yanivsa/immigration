name: Cleanup Jules branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "45 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-jules-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch for closed Jules PR
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import urllib.parse
          import subprocess

          ref = os.environ.get('REF','')
          title = os.environ.get('TITLE','')
          body = os.environ.get('BODY','') or ''

          # Only clean up branches clearly created by Jules article/vendor automation.
          is_jules = 'PR created automatically by Jules' in body
          allowed = (
              ref.startswith('nightly-article-')
              or ref.startswith('jules-vendor-enrichment-')
              or ref.startswith('enrich-vendors-')
              or ref.startswith('vendor-enrichment-')
          )
          title_ok = bool(re.match(r'^(Auto-publish:|chore\(data\): nightly vendor enrichment|chore: nightly vendor enrichment|No-op:)', title, re.I))

          if not (is_jules and allowed and title_ok):
              print('Skip branch cleanup:', {'ref': ref, 'title': title, 'is_jules': is_jules})
              raise SystemExit(0)

          repo = os.environ.get('GITHUB_REPOSITORY')
          token = os.environ.get('GITHUB_TOKEN')
          ref_enc = urllib.parse.quote(ref, safe='')
          url = f"https://api.github.com/repos/{repo}/git/refs/heads/{ref_enc}"

          print('Deleting ref', ref)
          subprocess.run(
              ['curl','--fail-with-body','-sS','-X','DELETE',
               '-H', f'Authorization: Bearer {token}',
               '-H', 'Accept: application/vnd.github+json',
               url],
              check=True,
          )
          PY

      - name: Daily cleanup stale automation branches (no open PR)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import sys

          repo = os.environ['REPO']
          token = os.environ['GITHUB_TOKEN']

          with open('open-prs.json', encoding='utf-8') as fh:
              prs = json.load(fh)

          open_heads = set((pr.get('head') or {}).get('ref') for pr in prs)

          url = f"https://api.github.com/repos/{repo}/git/matching-refs/heads/"
          res_proc = subprocess.run(
              ['curl','--fail-with-body','-sS',
               '-H', f'Authorization: Bearer {token}',
               '-H', 'Accept: application/vnd.github+json',
               url],
              capture_output=True, text=True
          )
          if res_proc.returncode != 0:
              print(f"Failed to fetch refs: {res_proc.stderr}")
              sys.exit(1)
          refs = json.loads(res_proc.stdout)

          for r in refs:
              ref_full = r.get('ref','')
              head = ref_full.replace('refs/heads/','')
              if not head or head == 'main' or head in open_heads:
                  continue
              name_lower = head.lower()
              keywords = [
                  'nightly', 'jules', 'bolt', 'code-health', '🧹', '🧪', 
                  'add-', 'test', 'refactor', 'sentinel', 'fix-', 'fix/',
                  'perf-', 'perf/', 'security-', 'feat/', 'geo-', 'seo-', 
                  'mobile-', 'kesher-', 'content-', 'feature-', 'feature/',
                  'main-', 'vendor', 'enrich', 'optimize-', 'article-'
              ]
              if not any(k in name_lower for k in keywords):
                  continue

              # Check protected state via branch metadata
              branch_url = f"https://api.github.com/repos/{repo}/branches/{urllib.parse.quote(head, safe='')}"
              b_res = subprocess.run(
                  ['curl', '--fail-with-body', '-sS',
                   '-H', f'Authorization: Bearer {token}',
                   '-H', 'Accept: application/vnd.github+json',
                   branch_url],
                  capture_output=True, text=True
              )
              if b_res.returncode != 0:
                  print(f"Failed to lookup branch {head}: {b_res.stderr}")
                  sys.exit(1)
              b_data = json.loads(b_res.stdout)
              if b_data.get('protected'):
                  print(f"Skipping protected branch {head}")
                  continue

              # delete
              del_url = f"https://api.github.com/repos/{repo}/git/refs/heads/{urllib.parse.quote(head, safe='')}"
              print('Deleting stale branch', head)
              del_res = subprocess.run(
                  ['curl','--fail-with-body','-sS','-X','DELETE',
                   '-H', f'Authorization: Bearer {token}',
                   '-H', 'Accept: application/vnd.github+json',
                   del_url],
                  capture_output=True, text=True
              )
              if del_res.returncode != 0:
                  print(f"Failed to delete {head}: {del_res.stderr}")
                  sys.exit(1)
          PY