name: Daily Article Publish (Legacy Manual Fallback)

on:
  workflow_dispatch: # Manual fallback only; daily publishing is handled by Jules

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: daily-article-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: steps.article_gate.outputs.blocked != 'true'
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Stop if article PR is already open
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import datetime as dt
          import json
          import re

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          pattern = re.compile(
              r"(auto-publish|publish article|article-\d+|nightly article|"
              r"content_queue|keyword-queue\.csv|article publication)",
              re.I,
          )
          now = dt.datetime.now(dt.UTC)

          def is_fresh(pr):
              updated = dt.datetime.fromisoformat(pr["updated_at"].replace("Z", "+00:00"))
              return now - updated <= dt.timedelta(days=3)

          def is_noop(pr):
              text = f"{pr.get('title') or ''}\n{pr.get('body') or ''}"
              return re.search(r"\bno[- ]?op\b|no files were edited|daily direct publish will no-op", text, re.I)

          blockers = [
              f"#{pr['number']} {pr['title']}"
              for pr in prs
              if is_fresh(pr)
              and not is_noop(pr)
              and (
                  pattern.search(pr.get("title") or "")
                  or pattern.search((pr.get("head") or {}).get("ref") or "")
                  or pattern.search(pr.get("body") or "")
              )
          ]
          if blockers:
              print("Open article publication PR exists; legacy direct publish will no-op.")
              for blocker in blockers:
                  print(f"- {blocker}")
              with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("blocked=true\n")
          else:
              with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("blocked=false\n")
          PY

      - name: Setup Node.js
        if: steps.article_gate.outputs.blocked != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        if: steps.article_gate.outputs.blocked != 'true'
        run: npm ci

      - name: Publish Next Article
        id: publish_step
        if: steps.article_gate.outputs.blocked != 'true'
        run: node scripts/publish-next.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Rebuild Site Assets
        if: steps.article_gate.outputs.blocked != 'true' && steps.publish_step.outputs.published == 'true'
        run: npm run build

      - name: Commit and Push Changes
        if: steps.article_gate.outputs.blocked != 'true' && steps.publish_step.outputs.published == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- \
            404.html \
            about.html \
            articles \
            assets \
            contact.html \
            dist \
            en \
            glossary \
            index.html \
            keyword-queue.csv \
            legal \
            llms-full.txt \
            llms.txt \
            robots.txt \
            ru \
            services \
            sitemap.xml \
            ua
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "Auto-publish: New article from queue"
          git push origin HEAD:main
