name: Auto-merge immigration article PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * *" # daily fallback; PR events handle normal merges immediately
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-merge-immigration-article-prs
  cancel-in-progress: false

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and merge eligible article PRs
        run: |
          set -euo pipefail

          token="${{ github.token }}"
          repo="${GITHUB_REPOSITORY}"
          event_name="${GITHUB_EVENT_NAME}"

          api() {
            curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$@"
          }

          if [ "$event_name" = "pull_request_target" ]; then
            numbers="$(python3 - <<'PY'
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)
          print(event["pull_request"]["number"])
          PY
          )"
          else
            api "https://api.github.com/repos/${repo}/pulls?state=open&per_page=100" > open-prs.json
            numbers="$(python3 - <<'PY'
          import json, re
          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)
          title_re = re.compile(r"(?:Auto-publish:\s*article-|Publish article-)\d+\b", re.I)
          for pr in prs:
              if title_re.search(pr.get("title") or ""):
                  print(pr["number"])
          PY
          )"
          fi

          if [ -z "${numbers}" ]; then
            echo "No eligible article PRs (candidates list empty)."
            exit 0
          fi

          for number in ${numbers}; do
            echo "Inspecting PR #${number}"

            api "https://api.github.com/repos/${repo}/pulls/${number}" > pr.json
            api "https://api.github.com/repos/${repo}/pulls/${number}/files?per_page=100" > pr-files.json

            python3 - <<'PY' > gate.env
          import json, re

          with open("pr.json", encoding="utf-8") as fh:
              pr = json.load(fh)
          with open("pr-files.json", encoding="utf-8") as fh:
              files = json.load(fh)

          filenames = [f.get("filename") for f in files if f.get("filename")]

          allowed_re = re.compile(r"^(keyword-queue\.csv|articles/article-\d+\.html|en/articles/article-\d+\.html|ru/articles/article-\d+\.html|ua/articles/article-\d+\.html|images/articles/article-\d+\.(?:jpe?g|png|webp))$", re.I)
          all_allowed = all(bool(allowed_re.match(p)) for p in filenames)
          # Fail closed if GitHub's first page does not cover the complete diff.
          complete = bool(filenames) and len(files) == pr.get("changed_files") and len(files) <= 100
          safe_shas = all(re.fullmatch(r"[0-9a-f]{40}", (pr.get(side) or {}).get("sha", "")) for side in ("head", "base"))

          title_ok = bool(re.search(r"(?:Auto-publish:\s*article-|Publish article-)\d+\b", pr.get("title") or "", re.I))

          eligible = (
              pr.get("state") == "open"
              and not pr.get("draft")
              and title_ok
              and (pr.get("head") or {}).get("repo", {}).get("full_name") == (pr.get("base") or {}).get("repo", {}).get("full_name")
              and (pr.get("base") or {}).get("ref") == "main"
              and all_allowed
              and complete
              and safe_shas
          )

          print(f"eligible={'true' if eligible else 'false'}")
          print(f"sha={(pr.get('head') or {}).get('sha') or ''}")
          print(f"base_sha={(pr.get('base') or {}).get('sha') or ''}")
          # Keep this bash-safe (no spaces/parens) because we `source` gate.env.
          print(f"reason={'ok' if eligible else 'not_eligible_files_title_base_head'}")
          PY

            . ./gate.env

            if [ "${eligible}" != "true" ]; then
              echo "PR #${number} not eligible: ${reason}"
              continue
            fi

            rm -rf "pr-${number}"
            mkdir "pr-${number}"
            cp pr.json "pr-${number}/pr.json"
            (
              cd "pr-${number}"
              git init -q
              git remote add origin "https://x-access-token:${token}@github.com/${repo}.git"
              git fetch --depth 1 origin "${sha}"
              git checkout -q FETCH_HEAD
              git fetch --depth 1 origin "${base_sha}"
              # The validator is executable code: load it from the trusted base.
              git show "${base_sha}:.github/scripts/validate-immigration-article-pr.py" > ../trusted-validator.py
              # A prior malicious symlink at an allowed article path is not data.
              if git diff --raw "${base_sha}" "${sha}" | grep -Eq '^:[0-7]{6} 120000 '; then
                echo "Refusing symbolic-link changes"
                exit 1
              fi
              python3 ../trusted-validator.py "${base_sha}" "${sha}" pr.json
              # Do not leave the write credential in the checkout used by tests.
              git remote set-url origin "https://github.com/${repo}.git"
              npm ci --ignore-scripts
              node --test
              npm run build
            )

            # PR merge can legitimately be blocked (e.g. conflicts). Treat that as "not eligible" rather than failing
            # the whole workflow run, so schedule-based runs keep operating.
            if ! curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -X PUT \
              -d "{\"commit_title\":\"Auto-merge immigration article PR #${number}\",\"merge_method\":\"squash\",\"sha\":\"${sha}\"}" \
              "https://api.github.com/repos/${repo}/pulls/${number}/merge" \
              > merge-result.json; then
              echo "Merge request failed for PR #${number}. Leaving PR open."
              cat merge-result.json || true
              continue
            fi
            python3 -c 'import json; assert json.load(open("merge-result.json")).get("merged") is True'

            api -X POST \
              -d "{\"body\":\"Auto-merged after trusted four-locale content, official-source, image-provenance and current-head validation; npm ci + node --test + npm run build passed.\"}" \
              "https://api.github.com/repos/${repo}/issues/${number}/comments" \
              > /dev/null
          done
