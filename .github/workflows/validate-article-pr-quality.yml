name: Validate generated article PR quality

on:
  pull_request:
    paths:
      - "articles/article-*.html"
      - "en/articles/article-*.html"
      - "ru/articles/article-*.html"
      - "ua/articles/article-*.html"
      - "images/articles/article-*"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-article-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate four locales, research, content and image provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_JSON: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ["PR_JSON"], encoding="utf-8"))
          json.dump(event["pull_request"], open("pr.json", "w", encoding="utf-8"))
          PY
          python3 .github/scripts/validate-immigration-article-pr.py "${BASE_SHA}" "${HEAD_SHA}" pr.json
