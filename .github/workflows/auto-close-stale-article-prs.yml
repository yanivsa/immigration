name: Auto-close stale immigration article PRs

on:
  schedule:
    - cron: "25 2 * * *" # daily
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: auto-close-stale-immigration-article-prs
  cancel-in-progress: false

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale article PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          now = dt.datetime.now(dt.UTC)

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          allowed_re = re.compile(r"^(keyword-queue\.csv|articles/article-\d+\.html|en/articles/article-\d+\.html|ru/articles/article-\d+\.html|ua/articles/article-\d+\.html)$")

          def api(url, method="GET", body=None):
              args = [
                  "curl","--fail-with-body","-sS",
                  "-X", method,
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/vnd.github+json",
              ]
              if body is not None:
                  args += ["-H","Content-Type: application/json","-d", json.dumps(body)]
              args.append(url)
              out = subprocess.check_output(args)
              return json.loads(out.decode("utf-8")) if out else {}

          for pr in prs:
              number = pr["number"]
              title = pr.get("title") or ""
              updated = dt.datetime.fromisoformat(pr["updated_at"].replace("Z", "+00:00"))
              age_h = (now - updated).total_seconds() / 3600.0
              if age_h < 72:
                  continue

              files = api(f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100")
              filenames = [f.get("filename") for f in files if f.get("filename")]
              if not filenames:
                  continue

              if not all(bool(allowed_re.match(f)) for f in filenames):
                  continue

              comment = "Auto-closed stale article PR (72h+) to unblock scheduled publishing. Reopen if still needed."
              api(f"https://api.github.com/repos/{repo}/issues/{number}/comments", method="POST", body={"body": comment})
              api(f"https://api.github.com/repos/{repo}/pulls/{number}", method="PATCH", body={"state": "closed"})
              print(f"Closed stale immigration article PR #{number}: {title}")
          PY