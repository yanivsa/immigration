name: Auto-close no-op PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "15 3 * * *" # daily fallback sweep
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: auto-close-noop-prs
  cancel-in-progress: false

jobs:
  close_noops:
    runs-on: ubuntu-latest
    steps:
      - name: Close no-op PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            python3 - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)
          with open("open-prs.json", "w", encoding="utf-8") as fh:
              json.dump([event["pull_request"]], fh)
          PY
          else
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
              > open-prs.json
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          event_name = os.environ["EVENT_NAME"]
          token = os.environ["GITHUB_TOKEN"]

          def iso_to_dt(s: str):
              return datetime.fromisoformat(s.replace("Z", "+00:00")).astimezone(timezone.utc)

          def fetch_pr(number: int):
              result = subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "-sS",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      f"https://api.github.com/repos/{repo}/pulls/{number}",
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              return json.loads(result.stdout)

          now = datetime.now(timezone.utc)

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          title_re = re.compile(r"(^no[- ]?op:)|(^chore:\s*no[- ]?op\b)|(\bno[- ]?op\b)|(blocked by .*pr)|(blocking branch)", re.I)
          body_re = re.compile(
              r"(no[- ]?op summary|no files were edited|no files were modified|"
              r"files edited:\s*(none|no)|selector was not run|finished as a no[- ]?op|"
              r"completed as a no[- ]?op|run halted as no[- ]?op|blocking .*pr|blocking .*branch)",
              re.I,
          )

          candidates = []
          for pr in prs:
              title = pr.get("title") or ""
              body = pr.get("body") or ""
              updated_at = pr.get("updated_at") or ""
              looks_noop = bool(title_re.search(title) and body_re.search(body))
              if not looks_noop or not updated_at:
                  continue

              details = pr if pr.get("changed_files") is not None else fetch_pr(pr["number"])
              changed_files = details.get("changed_files")
              if changed_files != 0:
                  print(f"Skipping PR #{pr['number']}: no-op text but changed_files={changed_files}")
                  continue

              age_h = 0.0
              reason = "new zero-file no-op PR"
              if event_name != "pull_request_target":
                  age_h = (now - iso_to_dt(updated_at)).total_seconds() / 3600.0
                  reason = "aged zero-file no-op PR"
                  if age_h < 6:
                      continue
              candidates.append((pr["number"], title, age_h, reason))

          if not candidates:
              print("No no-op PRs to close")
              raise SystemExit(0)

          for number, title, age_h, reason in candidates:
              print(f"Closing no-op PR #{number}: {title} ({reason}, age {age_h:.1f}h)")
              comment = (
                  "Auto-closed by workflow: detected a Jules no-op PR with zero changed files. "
                  "Keeping the PR list clean so future scheduled runs are not obscured by empty PRs."
              )
              subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "-sS",
                      "-X",
                      "POST",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-d",
                      json.dumps({"body": comment}),
                      f"https://api.github.com/repos/{repo}/issues/{number}/comments",
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "-sS",
                      "-X",
                      "PATCH",
                      "-H",
                      f"Authorization: Bearer {token}",
                      "-H",
                      "Accept: application/vnd.github+json",
                      "-d",
                      json.dumps({"state": "closed"}),
                      f"https://api.github.com/repos/{repo}/pulls/{number}",
                  ],
                  check=True,
              )
          PY