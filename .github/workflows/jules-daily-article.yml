name: Jules Daily Immigration Article

on:
  schedule:
    - cron: "30 0 * * *" # 03:30 Israel during UTC+3; starts Jules and exits quickly
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-daily-immigration-article
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop if an immigration article PR is already open
        id: article_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          article_re = re.compile(
              r"(?:^|[-_/ ])(?:publish|article|content[-_ ]?queue|keyword[-_ ]?queue)(?:$|[-_/ :0-9])",
              re.I,
          )
          blockers = []
          for pr in prs:
              if pr.get("draft") or (pr.get("base") or {}).get("ref") != "main":
                  continue
              evidence = " ".join([
                  pr.get("title") or "",
                  (pr.get("head") or {}).get("ref") or "",
              ])
              if article_re.search(evidence):
                  blockers.append(f"#{pr['number']} {pr['title']} {pr['html_url']}")

          blocked = bool(blockers)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blocked else 'false'}\n")

          if blockers:
              print("Current open article PR blocks a duplicate Jules article session:")
              print("\n".join(blockers))
          else:
              print("No open article PR blocks today's Jules session.")
          PY

      - name: Start Jules daily immigration article session
        if: steps.article_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Daily immigration article",
            "prompt": "Create today's immigration-law article fully autonomously in yanivsa/immigration from current main. Never ask for confirmation or plan approval. First inspect keyword-queue.csv, the 30 most recent articles in all locales, current open PRs, and the repository quality validator so the work is factual and non-duplicate. If a due queue row exists, consume exactly the first due row; otherwise choose one high-value gap in Israeli immigration law and leave the queue unchanged. Determine the next article number. Research the topic before writing using current primary official sources, primarily exact gov.il pages from the Population and Immigration Authority, legislation, regulations, official procedures, or other authoritative Israeli government material. Do not invent requirements, deadlines, rights, outcomes, statistics, quotations, clients, cases, or source links. Clearly distinguish general information from advice and use cautious language where rules depend on facts or current procedure. Create exactly one original article in four complete locales with the same ID: Hebrew articles/article-N.html, English en/articles/article-N.html, Russian ru/articles/article-N.html, and Ukrainian ua/articles/article-N.html. Each details section must contain 650-1200 natural words in that locale, answer the search intent directly, contain useful headings and practical topic-specific guidance, avoid boilerplate, keyword stuffing and translation artifacts, and include at least two distinct exact official gov.il source links in its sources section. Produce exactly one topic-specific royalty-safe image at images/articles/article-N.jpg, .jpeg, .png or .webp, at least 1200x630. Use only Unsplash or Pexels, retain the exact source page or image URL and matching license, inspect the actual pixels, and use the same local image with concrete localized alt text in all four articles, social metadata and Article schema. Do not reuse a generic legacy image. Allowed edits are only the four article HTML files, exactly one images/articles/article-N image, and keyword-queue.csv only when consuming a due row. Run npm ci, node --test, npm run build, and the trusted article validator before submission. Create one non-draft PR targeting main titled exactly `Publish article-N: <short-intent>`. The PR body must contain exact single-line fields: `Research Sources: <at least two exact gov.il URLs>`, `Image Source URL: <exact Unsplash or Pexels URL>`, `Image License: Unsplash License` or `Image License: Pexels License`, `Image SHA-256: <64 lowercase hex>`, `Image Dimensions: <width>x<height>`, and `Image Visual Match: <concrete description of visible pixels and relevance>`, plus article ID, four paths, validation results and risks. Confirm the changed-file list matches the remote diff. If any source, translation, image provenance, pixel match or validation cannot be completed truthfully, finish with zero edits and no PR; never create a no-op PR.",
            "sourceContext": {
              "source": "sources/github/yanivsa/immigration",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          python3 - <<'PY'
          import json
          path = "payload.json"
          payload = json.load(open(path, encoding="utf-8"))
          payload["prompt"] += (
              "\n\nNon-interruption invariant: never ask for confirmation, feedback, permission, "
              "review, or approval at any point. A validator failure is an instruction to repair "
              "every reported failure and rerun all gates, never a reason to ask whether a proposed "
              "repair sounds correct. Continue until the validated PR or clean zero-edit result is terminal."
          )
          json.dump(payload, open(path, "w", encoding="utf-8"), ensure_ascii=False)
          PY

          status="$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -o response.json -w '%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions)"
          cat response.json
          test "${status}" = "200" -o "${status}" = "201"

          python3 - <<'PY'
          import json
          with open("response.json", encoding="utf-8") as fh:
              response = json.load(fh)
          name = response.get("name") or (response.get("session") or {}).get("name")
          if not isinstance(name, str) or not name.startswith("sessions/"):
              raise SystemExit("Jules did not return a session id")
          print(f"Started {name}; GitHub runner can exit while Jules continues asynchronously.")
          PY
