name: Jules Nightly Code Health

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jules-nightly-code-health
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if a related maintenance PR is already open
        id: backlog_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
            > open-prs.json

          python3 - <<'PY'
          import json, os, re

          with open("open-prs.json", encoding="utf-8") as fh:
              prs = json.load(fh)

          article_pattern = re.compile(
              r"article|publish|content[_ -]?queue|keyword[_ -]?queue|auto[_ -]?publish",
              re.I,
          )
          maintenance_pattern = re.compile(
              r"(?:^|[-_/ ])(?:test|tests|testing|security|ssrf|performance|"
              r"code[-_ ]?health|maintenance|reliability|build|seo[-_ ]?fix|"
              r"split[-_ ]?sentences|submit[-_ ]?form|parse[-_ ]?datetime)(?:$|[-_/ :])|"
              r"🧪|⚡|🔒",
              re.I,
          )

          blockers = []
          for pr in prs:
              if pr.get("draft") or (pr.get("base") or {}).get("ref") != "main":
                  continue
              evidence = " ".join([
                  pr.get("title") or "",
                  (pr.get("head") or {}).get("ref") or "",
              ])
              if article_pattern.search(evidence):
                  continue
              if maintenance_pattern.search(evidence):
                  blockers.append(
                      f"#{pr['number']} {pr['title']} {pr['html_url']}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"blocked={'true' if blockers else 'false'}\n")

          if blockers:
              print("Current open non-draft maintenance PRs block a new Jules session:")
              print("\n".join(blockers))
          else:
              print("No current open non-draft maintenance PR blocks this run.")
          PY

      - name: Start Jules autonomous code-health session
        if: steps.backlog_gate.outputs.blocked != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Nightly immigration code-health sweep",
            "prompt": "Nightly immigration code-health sweep. Run fully autonomously. Do not ask the user for confirmation, clarification, plan approval, review, Start clicks, issue selection, task selection, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue. Never create a no-op PR. First refresh main, fetch/prune branches when possible, and inspect current open PRs and branches. Backlog gate: Live GitHub open-PR API state at execution time is the sole authority for the backlog gate. Prompt narration, remembered backlog state, closed/merged PRs, old branches, old sessions, draft/no-op items, and statements such as \"there are many existing open PRs\" are not evidence and must never block a run. Re-query current open, non-draft PRs targeting main immediately before deciding. Only a currently open, related code-health/testing/security/performance/maintenance PR may block. If there is no live related blocker, Jules must choose exactly one smallest safe non-duplicate item and finish tests/build and a real ready-for-review PR; it must not convert the run to a no-op merely because the prompt or memory says backlog exists. If a live blocker exists, finish a factual no-op summary immediately with PR number/title and zero edits; never ask for approval and never remain AWAITING_USER_FEEDBACK. On GitHub/API failure, log the failure and mark live state unverified; do not infer blockers or false success. A branch whose associated PR is closed or merged, a deleted/stale ref, or an article/generator branch without an open code-health PR must never block the backlog gate; explicitly log it as stale and continue. If a proposed issue already has a merged PR, existing branch, recent session, or equivalent fix/test, skip it. Prefer a focused test, reliability check, build-script guard, documentation-in-code cleanup, or small maintainability improvement. If there is truly no safe non-duplicate task, complete the Jules session with a plain no-op summary and do not edit files and do not create a PR. If a safe task exists, make exactly one coherent change, run relevant tests/build checks, and create one PR automatically. Do not publish immigration articles in this task.",
            "sourceContext": {
              "source": "sources/github/yanivsa/immigration",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          python3 - <<'PY'
          import json
          with open("payload.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          payload["prompt"] += "\n\nAuthoritative blocker-evidence rule: never describe a branch by itself as active, ongoing, or blocking. A backlog blocker is valid only when a fresh live GitHub query returns an open, non-draft PR targeting main and the no-op summary includes that PR's number, exact title, and https://github.com/.../pull/... URL. A remote branch without that live open-PR URL is stale/non-blocking even if it still exists. If GitHub cannot be queried, mark blocker state unverified and do not convert the run to a blocker-based no-op. Before the final no-op decision, repeat the live PR query so a PR merged during the session cannot block the run.\n\nDuplicate-backlog invariant: any current open non-draft PR targeting main for tests, security, performance, reliability, build tooling, SEO utilities, or code health is a related blocker even when it changes a different file. Do not create a second maintenance PR while one exists. The GitHub Actions preflight gate is authoritative; if Jules is started, still repeat the live query before editing and before PR creation so a PR opened concurrently cannot produce another maintenance PR."
          with open("payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False)
          PY

          response="$(curl -sS -w '\n%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions || true)"
          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"
          printf '%s\n' "$body"
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            exit 0
          fi
          if printf '%s' "$body" | grep -q 'FAILED_PRECONDITION'; then
            echo "Jules refused to start a duplicate/concurrent session; treating this as non-fatal."
            exit 0
          fi
          exit 1
