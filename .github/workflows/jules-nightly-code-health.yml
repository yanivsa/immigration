name: Jules Nightly Code Health

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-nightly-code-health
  cancel-in-progress: false

jobs:
  start-jules:
    runs-on: ubuntu-latest
    steps:
      - name: Start Jules autonomous code-health session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}"

          cat > payload.json <<'JSON'
          {
            "title": "Nightly immigration code-health sweep",
            "prompt": "Nightly immigration code-health sweep. Run fully autonomously. Do not ask the user for confirmation, clarification, plan approval, review, Start clicks, issue selection, task selection, or implementation choices. Never ask \"does this sound good\" or any equivalent question. If a decision is needed, choose the smallest safe repo-consistent option yourself and continue. Never create a no-op PR. First refresh main, fetch/prune branches when possible, and inspect current open PRs and branches. Backlog gate: if any open non-draft code-health, test, refactor, cleanup, or maintainability PR from Jules already targets main, finish this run immediately with a plain no-op session summary that names the blocking PR; do not select another issue, do not edit files, do not create a branch or commit, and do not create a PR. A branch whose associated PR is closed or merged, a deleted/stale ref, or an article/generator branch without an open code-health PR must never block the backlog gate; explicitly log it as stale and continue. Only when no such active code-health PR exists may you choose exactly one small high-confidence repo-consistent task. If a proposed issue already has a merged PR, existing branch, recent session, or equivalent fix/test, skip it. Prefer a focused test, reliability check, build-script guard, documentation-in-code cleanup, or small maintainability improvement. If there is truly no safe non-duplicate task, complete the Jules session with a plain no-op summary and do not edit files and do not create a PR. If a safe task exists, make exactly one coherent change, run relevant tests/build checks, and create one PR automatically. Do not publish immigration articles in this task.",
            "sourceContext": {
              "source": "sources/github/yanivsa/immigration",
              "githubRepoContext": {
                "startingBranch": "main"
              }
            },
            "requirePlanApproval": false,
            "automationMode": "AUTO_CREATE_PR"
          }
          JSON

          response="$(curl -sS -w '\n%{http_code}' \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://jules.googleapis.com/v1alpha/sessions || true)"
          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"
          printf '%s\n' "$body"
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            exit 0
          fi
          if printf '%s' "$body" | grep -q 'FAILED_PRECONDITION'; then
            echo "Jules refused to start a duplicate/concurrent session; treating this as non-fatal."
            exit 0
          fi
          exit 1
